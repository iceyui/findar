name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend — fmt / clippy / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Tests
        run: cargo test

  docker-build-scan:
    name: Docker build & scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ar-vanila-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE=/
            VITE_SUPABASE_URL=
            VITE_SUPABASE_PUBLISHABLE_KEY=
            VITE_TURNSTILE_SITE_KEY=

      # Gagal jika ada vulnerability HIGH/CRITICAL yang sudah tersedia fix-nya.
      # Longgarkan `exit-code` ke 0 kalau mau hanya warning.
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ar-vanila-${{ matrix.service }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
