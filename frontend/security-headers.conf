# Security headers — dipakai via `include` dari nginx.conf (server level dan
# setiap location yang punya add_header sendiri, karena add_header menimpa
# inheritance nginx).
#
# Catatan CSP:
# - connect-src sudah mengizinkan Supabase (*.supabase.co) + Turnstile.
#   Jika VITE_API_BASE di-set ke domain API absolut (mis. deploy Coolify),
#   tambahkan domain itu juga di connect-src.
# - Turnstile butuh challenges.cloudflare.com pada script-src, frame-src,
#   connect-src.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob: https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;
