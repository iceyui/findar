services:
  backend:
    build:
      context: ./backend
    container_name: ar-vanila-backend
    # Opsional: tanpa .env, API tetap jalan (auth & Turnstile off).
    env_file:
      - path: ./backend/.env
        required: false
    networks:
      - internal
    stop_grace_period: 30s
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    container_name: ar-vanila-frontend
    ports:
      - "80:8080"
    networks:
      - edge
      - internal
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=20m
      - /var/run:size=5m
      - /tmp:size=10m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    init: true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  uploads:
  outputs:

networks:
  # Terhubung ke host (via published port) — hanya frontend.
  edge:
  # Backend tidak pernah expose port; hanya reachable dari frontend.
  internal:
    internal: true
